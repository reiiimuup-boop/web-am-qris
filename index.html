<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli Alight Motion Premium Rp1.000 - Reii Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
    }
    .code-font { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900/90 border border-purple-900/40 backdrop-blur-xl rounded-3xl p-6 shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-semibold tracking-wide">
        <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
        REII STORE OFFICIAL (OTOMATIS)
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Alight Motion Premium</h1>
      <p class="text-xs text-purple-400 font-semibold">Harga Promo: Rp 1.000 / Akun</p>
    </div>

    <!-- Step 1: Input Email -->
    <div id="step-1" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Email Alight Motion</label>
        <input type="email" id="email" placeholder="nama@gmail.com" 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 transition-colors">
      </div>

      <button onclick="createQris()" id="btn-create" 
        class="w-full bg-purple-600 hover:bg-purple-500 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-purple-600/25">
        Lanjut ke Pembayaran QRIS
      </button>
    </div>

    <!-- Step 2: Tampilan QRIS -->
    <div id="step-2" class="hidden space-y-4 text-center">
      <div class="bg-slate-950/80 border border-purple-900/40 rounded-2xl p-4 space-y-3">
        <p class="text-xs font-semibold text-purple-300">Scan QRIS JagoPay Di Bawah Ini</p>
        
        <div class="overflow-hidden rounded-xl border border-purple-500/30 p-2 bg-white inline-block">
          <img id="generated-qris" src="" alt="QRIS Pembayaran" class="w-56 h-56 mx-auto object-contain">
        </div>

        <div class="space-y-1">
          <p class="text-sm font-bold text-emerald-400">Total: Rp 1.000</p>
          <p class="text-[11px] text-amber-400/90 flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            Mengecek pembayaran otomatis...
          </p>
        </div>
      </div>
    </div>

    <!-- Step 3: Input Link Verifikasi -->
    <div id="step-3" class="hidden space-y-4">
      <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-emerald-400 text-center">
        Pembayaran Lunas! Magic Link telah dikirim ke email Anda.
      </div>

      <div>
        <label for="verify-link" class="block text-xs font-semibold text-slate-300 mb-1.5">Tempel Link Verifikasi dari Email</label>
        <input type="url" id="verify-link" placeholder="https://alight-creative.firebaseapp.com/__/auth/..." 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500">
      </div>

      <button onclick="verifyLink()" id="btn-verif" 
        class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/25">
        Verifikasi & Aktifkan Premium
      </button>
    </div>

    <!-- Terminal Output -->
    <div class="bg-slate-950 rounded-2xl p-4 border border-slate-800/80 space-y-2">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-[11px] font-semibold text-slate-500 tracking-wider uppercase">System Console</span>
      </div>
      <div id="console-log" class="code-font text-xs text-purple-400 min-h-[70px] max-h-[100px] overflow-y-auto space-y-1 pt-1">
        <p class="text-slate-500">[System Ready] Masukkan email untuk memulai...</p>
      </div>
    </div>

  </div>

  <script>
    const JAGOPAY_KEY = 'jp_c49a23ea3d01a837e789c2bdb30b';
    let currentTrxId = null;
    let checkInterval = null;

    function log(msg, type = 'info') {
      const consoleLog = document.getElementById('console-log');
      const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
      let colorClass = 'text-purple-400';
      if (type === 'error') colorClass = 'text-rose-400';
      if (type === 'warn') colorClass = 'text-amber-400';

      const p = document.createElement('p');
      p.className = `${colorClass} break-all`;
      p.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
      consoleLog.appendChild(p);
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function createQris() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        log('Error: Masukkan email terlebih dahulu!', 'error');
        return;
      }

      const btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.innerText = 'Membuat QRIS JagoPay...';
      log('Meminta sistem membuat QRIS Dinamis...');

      try {
        const targetUrl = `https://jagopay.my.id/api/deposit/create`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl + `?api_key=${JAGOPAY_KEY}&amount=1000&code=QRIS`)}`;
        
        const res = await fetch(proxyUrl);
        const wrapper = await res.json();
        const data = JSON.parse(wrapper.contents);

        if (data.status || data.qr_link || data.data?.qr_link) {
          const qrUrl = data.qr_link || data.data?.qr_link || data.qr_code;
          currentTrxId = data.trx_id || data.data?.trx_id;

          document.getElementById('generated-qris').src = qrUrl;
          document.getElementById('step-1').classList.add('hidden');
          document.getElementById('step-2').classList.remove('hidden');

          log('QRIS Berhasil dibuat. Silakan bayar Rp1.000.', 'info');
          startCheckingStatus(email);
        } else {
          log(`Gagal: ${data.message || 'Respons JagoPay tidak valid.'}`, 'error');
        }
      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Lanjut ke Pembayaran QRIS';
      }
    }

    function startCheckingStatus(email) {
      if (checkInterval) clearInterval(checkInterval);

      checkInterval = setInterval(async () => {
        try {
          const targetUrl = `https://jagopay.my.id/api/deposit/status?api_key=${JAGOPAY_KEY}&trx_id=${currentTrxId}`;
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          
          const res = await fetch(proxyUrl);
          const wrapper = await res.json();
          const data = JSON.parse(wrapper.contents);

          if (data.status === 'success' || data.status === 'paid' || data.data?.status === 'PAID') {
            clearInterval(checkInterval);
            log('PEMBAYARAN DITERIMA! Mengirim Magic Link...', 'info');
            
            const magicUrl = `https://api.kyzznekoo.my.id/api/alightmotion/v3/magic-link?email=${encodeURIComponent(email)}`;
            await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(magicUrl)}`);

            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
          }
        } catch (err) {
          console.error('Check status error:', err);
        }
      }, 5000);
    }

    async function verifyLink() {
      const email = document.getElementById('email').value.trim();
      const verifyUrl = document.getElementById('verify-link').value.trim();

      if (!verifyUrl) {
        log('Error: Salin dan tempel URL dari email ke kolom!', 'error');
        return;
      }

      const btn = document.getElementById('btn-verif');
      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';

      try {
        const targetUrl = `https://api.kyzznekoo.my.id/api/alightmotion/v3/applyPremium?email=${encodeURIComponent(email)}&link=${encodeURIComponent(verifyUrl)}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        const wrapper = await response.json();
        const data = JSON.parse(wrapper.contents);

        if (data.status) {
          log('SUKSES! Status Premium Alight Motion telah aktif.', 'info');
          alert('Selamat! Akun Alight Motion Anda telah resmi menjadi Premium.');
        } else {
          log(`Gagal Verifikasi: ${data.data?.message || data.message || 'Token/Link tidak valid.'}`, 'error');
        }
      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Verifikasi & Aktifkan Premium';
      }
    }
  </script>
</body>
</html>
