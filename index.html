<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli Alight Motion Premium Rp1.000 - Reii Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
    }
    .code-font { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-purple-900/40 rounded-3xl p-6 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-extrabold text-white">Alight Motion Premium</h1>
      <p class="text-xs text-purple-400 font-semibold">Harga Promo: Rp 1.000 / Akun</p>
    </div>

    <div id="step-1" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Email Alight Motion</label>
        <input type="email" id="email" value="deop5986@gmail.com" 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100">
      </div>

      <button onclick="testApi()" id="btn-create" 
        class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl text-sm transition-all">
        Lanjut ke Pembayaran QRIS
      </button>
    </div>

    <div id="step-2" class="hidden space-y-4 text-center">
      <div class="bg-slate-950 rounded-2xl p-4 border border-purple-900/40">
        <p class="text-xs font-semibold text-purple-300 mb-2">Scan & Bayar Pakai E-Wallet / Bank</p>
        <div class="bg-white p-2 rounded-xl inline-block">
          <img id="qris-img" src="" alt="QRIS" class="w-56 h-56 mx-auto object-contain">
        </div>
      </div>
    </div>

    <!-- Console Log Detail -->
    <div class="bg-slate-950 rounded-2xl p-4 border border-slate-800 space-y-2">
      <span class="text-[11px] font-semibold text-slate-500 uppercase">System Console Log</span>
      <div id="console-log" class="code-font text-xs text-purple-400 min-h-[100px] max-h-[150px] overflow-y-auto space-y-1">
        <p class="text-slate-500">[System Ready] Siap melakukan test permintaan...</p>
      </div>
    </div>

  </div>

  <script>
    const JAGOPAY_KEY = 'jp_c49a23ea3d01a837e789c2bdb30b';

    function log(msg, isError = false) {
      const consoleLog = document.getElementById('console-log');
      const time = new Date().toLocaleTimeString('id-ID');
      const p = document.createElement('p');
      p.className = `${isError ? 'text-rose-400' : 'text-purple-300'} break-all`;
      p.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
      consoleLog.appendChild(p);
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function testApi() {
      const btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.innerText = 'Memproses...';

      const targetUrl = `https://jagopay.my.id/api/qris?api_key=${JAGOPAY_KEY}&amount=1000`;
      log(`Menghubungkan ke API...`);

      // Menggunakan proxy khusus bypass SSL/Cloudflare
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const wrapper = await res.json();
        
        log(`Status Proxy: ${res.status}`);
        log(`Isi Respon Raw: ${wrapper.contents.substring(0, 100)}...`);

        if (wrapper.contents) {
          let data;
          try {
            data = JSON.parse(wrapper.contents);
          } catch(e) {
            // Jika dikirim string QRIS murni
            if (wrapper.contents.includes('000201')) {
              data = { status: true, qris: wrapper.contents.trim() };
            }
          }

          if (data) {
            let qrUrl = data.qris_url || data.data?.qris_url;
            if (!qrUrl && (data.qris || data.qr_string)) {
              qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(data.qris || data.qr_string)}`;
            }

            if (qrUrl) {
              document.getElementById('qris-img').src = qrUrl;
              document.getElementById('step-1').classList.add('hidden');
              document.getElementById('step-2').classList.remove('hidden');
              log('BERHASIL! Gambar QRIS didapatkan.');
              return;
            }
          }
        }
        log('Respon JagoPay bukan data QRIS valid. Cek API Key atau status server JagoPay.', true);
      } catch (err) {
        log(`Error Fetch: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Lanjut ke Pembayaran QRIS';
      }
    }
  </script>
</body>
</html>
